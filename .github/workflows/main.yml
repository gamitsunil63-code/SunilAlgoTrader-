name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q SunilAlgoTrader_Android_V1.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Fix JVM target
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          p.write_text(s)
          PY
      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunilAlgoTrader-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
